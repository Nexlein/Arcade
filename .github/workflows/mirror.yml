name: Mirror to Epitech

on: [push, delete] 

jobs:
  mirror_to_epitech:
    runs-on: ubuntu-latest
    if: github.repository == 'Nexlein/Arcade'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Push to Epitech Mirror
        run: |
          # 1. Add Github to known hosts to avoid SSH authenticity prompts
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          # 2. Add the Epitech repository as a remote
          git remote add epitechArcade git@github.com:EpitechPGE2-2025/G-OOP-400-MPL-4-1-arcade-5.git

          # 3. Push all branches and tags to the Epitech repository, forcing the update
          git push epitechArcade --all --force
          git push epitechArcade --tags --mirror
